[package]
name = "pallet-defi"
authors = ["Nikola <nikola@ceresblockchain.solutions>"]
description = "An example of a custom substrate pallet."
version = "1.0.0"
edition = "2021"
license = "MIT-0"
repository = "https://github.com/Web3-Academy-Rust-Course/rust-course-part-two"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6.1", default-features = false, features = [
	"derive",
] }
hex-literal = "0.3.1"
scale-info = { version = "2.11.6", default-features = false }
frame-benchmarking = { version = "40.0.0", default-features = false }
frame-support = { version = "40.1.0", default-features = false }
frame-system = { version = "40.1.0", default-features = false }

[dev-dependencies]
sp-core = { version = "36.1.0", default-features = false }
sp-io = { version = "40.0.1", default-features = false }
sp-runtime = { version = "41.1.0", default-features = false }
pallet-balances = { version = "41.1.0", default-features = false }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
	"sp-runtime/std",
]
runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime"]